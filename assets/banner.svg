<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accentViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pulseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.45; }
    .graph-edge { stroke: #38bdf8; stroke-opacity: 0.35; stroke-dasharray: 4 4; animation: dashMove 18s linear infinite; }
    .graph-edge-active { stroke: url(#accentViolet); stroke-width: 1.5; stroke-opacity: 0.6; stroke-dasharray: 6 6; animation: dashMoveReverse 12s linear infinite; }
    
    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }
    @keyframes dashMoveReverse {
      to { stroke-dashoffset: 100; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.35); opacity: 1; filter: drop-shadow(0 0 10px #38bdf8); }
    }
    @keyframes pulsePink {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.4); opacity: 0.95; filter: drop-shadow(0 0 12px #ec4899); }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPillAlt {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes particleOrbit {
      0% { transform: rotate(0deg) translateX(45px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(45px) rotate(-360deg); }
    }

    .node-p1 { transform-origin: 140px 90px; animation: pulse 4s ease-in-out infinite; }
    .node-p2 { transform-origin: 1040px 100px; animation: pulsePink 5s ease-in-out infinite; }
    .node-p3 { transform-origin: 180px 270px; animation: pulse 6s ease-in-out infinite 1s; }
    .node-p4 { transform-origin: 1020px 260px; animation: pulse 4.5s ease-in-out infinite 2s; }
    
    .pill-float-1 { animation: floatPill 6s ease-in-out infinite; }
    .pill-float-2 { animation: floatPillAlt 7s ease-in-out infinite 1s; }
    .pill-float-3 { animation: floatPill 5.5s ease-in-out infinite 2s; }
    .pill-float-4 { animation: floatPillAlt 6.5s ease-in-out infinite 1.5s; }

    .orbit-dot { transform-origin: 600px 70px; animation: particleOrbit 10s linear infinite; }
  </style>

  <!-- Deep Slate Tech Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>

  <!-- Matrix/Grid Texture -->
  <g class="grid-line">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Radial ambient lighting in corners -->
  <circle cx="100" cy="80" r="180" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1100" cy="90" r="200" fill="#ec4899" opacity="0.08" filter="url(#glow)"/>
  <circle cx="600" cy="180" r="260" fill="#6366f1" opacity="0.07" filter="url(#glow)"/>

  <!-- Dynamic Graph Network in Background / Flanks -->
  <!-- Left Graph Cluster -->
  <line x1="140" y1="90" x2="80" y2="190" class="graph-edge"/>
  <line x1="140" y1="90" x2="220" y2="160" class="graph-edge-active"/>
  <line x1="80" y1="190" x2="180" y2="270" class="graph-edge"/>
  <line x1="220" y1="160" x2="180" y2="270" class="graph-edge"/>
  <line x1="220" y1="160" x2="320" y2="230" class="graph-edge"/>
  <line x1="140" y1="90" x2="280" y2="70" class="graph-edge"/>

  <!-- Right Graph Cluster -->
  <line x1="1040" y1="100" x2="950" y2="180" class="graph-edge-active"/>
  <line x1="1040" y1="100" x2="1130" y2="190" class="graph-edge"/>
  <line x1="950" y1="180" x2="1020" y2="260" class="graph-edge"/>
  <line x1="1130" y1="190" x2="1020" y2="260" class="graph-edge"/>
  <line x1="950" y1="180" x2="870" y2="240" class="graph-edge"/>
  <line x1="1040" y1="100" x2="920" y2="70" class="graph-edge"/>

  <!-- Cross Bridging Links (Low opacity across center behind text backdrop) -->
  <line x1="280" y1="70" x2="600" y2="40" class="graph-edge" opacity="0.15"/>
  <line x1="920" y1="70" x2="600" y2="40" class="graph-edge" opacity="0.15"/>
  <line x1="320" y1="230" x2="600" y2="330" class="graph-edge" opacity="0.15"/>
  <line x1="870" y1="240" x2="600" y2="330" class="graph-edge" opacity="0.15"/>

  <!-- Left Pulsing Nodes -->
  <g class="node-p1">
    <circle cx="140" cy="90" r="7" fill="#38bdf8"/>
    <circle cx="140" cy="90" r="14" fill="#38bdf8" opacity="0.25"/>
  </g>
  <circle cx="80" cy="190" r="5" fill="#818cf8"/>
  <circle cx="220" cy="160" r="6" fill="#a855f7"/>
  <g class="node-p3">
    <circle cx="180" cy="270" r="7" fill="#06b6d4"/>
    <circle cx="180" cy="270" r="13" fill="#06b6d4" opacity="0.25"/>
  </g>
  <circle cx="280" cy="70" r="4.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="320" cy="230" r="4" fill="#818cf8" opacity="0.7"/>

  <!-- Right Pulsing Nodes -->
  <g class="node-p2">
    <circle cx="1040" cy="100" r="7" fill="#ec4899"/>
    <circle cx="1040" cy="100" r="15" fill="#ec4899" opacity="0.25"/>
  </g>
  <circle cx="950" cy="180" r="6" fill="#c084fc"/>
  <circle cx="1130" cy="190" r="5" fill="#38bdf8"/>
  <g class="node-p4">
    <circle cx="1020" cy="260" r="7" fill="#f43f5e"/>
    <circle cx="1020" cy="260" r="14" fill="#f43f5e" opacity="0.25"/>
  </g>
  <circle cx="920" cy="70" r="4.5" fill="#ec4899" opacity="0.7"/>
  <circle cx="870" cy="240" r="4" fill="#a855f7" opacity="0.7"/>

  <!-- Decorative Orbiting Point in Header -->
  <circle cx="600" cy="70" r="2" fill="#38bdf8" opacity="0.5"/>
  <g class="orbit-dot">
    <circle cx="600" cy="70" r="3" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- Floating Ambient Pills on Sides (Dynamic Work Graph Concept Nodes) -->
  <g class="pill-float-1" transform="translate(60, 45)">
    <rect width="130" height="28" rx="14" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1"/>
    <text x="65" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ Work Graph</text>
  </g>

  <g class="pill-float-2" transform="translate(65, 290)">
    <rect width="135" height="28" rx="14" fill="#1e293b" fill-opacity="0.85" stroke="#8b5cf6" stroke-width="1"/>
    <text x="67" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🧠 GraphRAG Context</text>
  </g>

  <g class="pill-float-3" transform="translate(1005, 45)">
    <rect width="135" height="28" rx="14" fill="#1e293b" fill-opacity="0.85" stroke="#ec4899" stroke-width="1"/>
    <text x="67" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🏢 Enterprise Ontologies</text>
  </g>

  <g class="pill-float-4" transform="translate(1000, 290)">
    <rect width="135" height="28" rx="14" fill="#1e293b" fill-opacity="0.85" stroke="#06b6d4" stroke-width="1"/>
    <text x="67" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🤖 AI Agent Grounding</text>
  </g>

  <!-- High-Contrast Protective Scrim for Text (Guarantees foreground clarity) -->
  <rect x="240" y="80" width="720" height="195" rx="20" fill="#070c18" fill-opacity="0.78" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Category Pill -->
    <rect x="490" y="98" width="220" height="26" rx="13" fill="#0f172a" stroke="url(#accentCyan)" stroke-width="1.2"/>
    <text x="600" y="115" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">ENTERPRISE CONTEXT FABRIC</text>

    <!-- Main Title -->
    <text x="600" y="168" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      Awesome Work Graph &amp; Knowledge Modeling
    </text>

    <!-- Subtitle / Value Prop -->
    <text x="600" y="202" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500">
      Enterprise Knowledge Graphs • Work Context Modeling • GraphRAG • Autonomous Agent Grounding
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(325, 222)">
      <text x="45" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">✦ SaaS Leaders</text>
      <text x="175" y="24" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">✦ Open-Source Engines</text>
      <text x="345" y="24" fill="#ec4899" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">✦ Enterprise Ontologies</text>
      <text x="495" y="24" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">✦ Live Star Metrics</text>
    </g>
  </g>
</svg>
