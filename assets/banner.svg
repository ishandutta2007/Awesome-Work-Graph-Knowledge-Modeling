ke-opacity:.6;stroke-dasharray:6 6;animation:dashMoveReverse 12s linear infinite}.node-p1{transform-origin:140px 90px;animation:pulse 4s ease-in-out infinite}.node-p2{transform-origin:1040px 100px;animation:pulsePink 5s ease-in-out infinite}.node-p3{transform-origin:180px 270px;animation:pulse 6s ease-in-out infinite 1s}.node-p4{transform-origin:1020px 260px;animation:pulse 4.5s ease-in-out infinite 2s}.pill-float-1{animation:floatPill 6s ease-in-out infinite}.pill-float-2{animation:floatPillAlt 7s ease-in-out infinite 1s}.pill-float-3{animation:floatPill 5.5s ease-in-out infinite 2s}.pill-float-4{animation:floatPillAlt 6.5s ease-in-out infinite 1.5s}.orbit-dot{transform-origin:600px 70px;animation:particleOrbit 10s linear infinite}</style><rect width="100%" height="100%" fill="url(#bgGradient)"/><g class="grid-line"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/><line x1="150" x2="150" y1="0" y2="360"/><line x1="300" x2="300" y1="0" y2="360"/><line x1="450" x2="450" y1="0" y2="360"/><line x1="600" x2="600" y1="0" y2="360"/><line x1="750" x2="750" y1="0" y2="360"/><line x1="900" x2="900" y1="0" y2="360"/><line x1="1050" x2="1050" y1="0" y2="360"/></g><circle cx="100" cy="80" r="180" fill="#38bdf8" filter="url(#glow)" opacity=".08"/><circle cx="1100" cy="90" r="200" fill="#ec4899" filter="url(#glow)" opacity=".08"/><circle cx="600" cy="180" r="260" fill="#6366f1" filter="url(#glow)" opacity=".07"/><line x1="140" x2="80" y1="90" y2="190" class="graph-edge"/><line x1="140" x2="220" y1="90" y2="160" class="graph-edge-active"/><line x1="80" x2="180" y1="190" y2="270" class="graph-edge"/><line x1="220" x2="180" y1="160" y2="270" class="graph-edge"/><line x1="220" x2="320" y1="160" y2="230" class="graph-edge"/><line x1="140" x2="280" y1="90" y2="70" class="graph-edge"/><line x1="1040" x2="950" y1="100" y2="180" cla